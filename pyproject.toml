[project]
name = "laife"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.162.7",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.3",
    "llm-core[openai,chroma] @ git+https://github.com/Pitrified/llm-core@v0.4.0",
    "loguru>=0.7.2",
    "pygame>=2.6.0",
    "rich>=13.9.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/laife"]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "notebook" },
    { include-group = "test" },
    { include-group = "tui" },
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-api-autonav>=0.2",
]
lint = [
    # Exact, and the same as rev in .pre-commit-config.yaml; bump both together.
    "ruff==0.17.2",
    # Exact, and the same as rev in .pre-commit-config.yaml; bump both together.
    "pyright[nodejs]==1.1.414",
    "pre-commit>=4.1.0",
    # Exact, and the same as rev in .pre-commit-config.yaml; bump both together.
    "detect-secrets==1.5.0",
    # Exact, and the same as rev in .pre-commit-config.yaml; bump both together.
    "nbstripout==0.9.1",
]
notebook = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.3",
    "rich>=13.9.2",
]
test = [
    "pytest>=8.3.2",
]
tui = [
    "textual>=0.60",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
# remember to adjust include paths as needed (eg scripts folder)
include = ["src", "tests"]
