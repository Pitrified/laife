# Third-party files the pages load, fetched on demand by `make vendor` into
# cache/vendor/ (gitignored) and served from there by laife.web.server, after a
# check against the lock written at extraction. Nothing here is committed but
# this manifest. See docs/guides/web.md, "Third-party files".
#
# Each npm package is pinned by exact version and by the integrity hash the npm
# registry publishes for its tarball; only the listed files are extracted.
# A release is taken once it has been out a few weeks.

[npm."pixi.js"]
# 8.22.0 rather than 8.23.0, which was three days old when this was pinned.
version = "8.22.0"
integrity = "sha512-QbTANHMZ751MIjLiLSUSM8a7LNMWwMIf0KbRCqlW+SPS9hNLfSVS+cl1O2SEp9g1K/wyLzj/OJHv+1TUfiPr/w=="
# A single ES module with no imports of its own.
files = ["dist/pixi.min.mjs"]

[npm.pixi-viewport]
# The last 6.x: every 7.x was under two weeks old when this was pinned.
# Its peer is pixi.js >= 8, and it imports "pixi.js" by name: the page's import map resolves it.
version = "6.0.3"
integrity = "sha512-2+qPJ0/n+8hQYhWvY+795+x9y3MiUrCOWacK0DY53whowWaGdx9iDocy7z1pBwjkZhC52YvrJQuZKK0sdVLtBw=="
files = ["dist/pixi_viewport.js"]
